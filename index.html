<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at center, #0a0a0a, #000000);
      color: #eaeaea;
      font-family: 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      animation: fadeIn 2s ease;
    }

    h1 {
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 30px;
      opacity: 0.8;
    }

    input {
      padding: 12px;
      width: 200px;
      background: transparent;
      border: 1px solid #555;
      color: white;
      text-align: center;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #aaa;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background: transparent;
      border: 1px solid #888;
      color: #ccc;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #111;
      border-color: #fff;
      color: white;
    }

    #result {
      margin-top: 25px;
      font-size: 14px;
      opacity: 0.8;
      min-height: 20px;
      transition: 0.5s;
    }

    .hidden {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px);}
      to { opacity: 1; transform: translateY(0);}
    }

    /* subtle glitch effect */
    .glitch {
      position: relative;
      color: white;
    }

    .glitch::before,
    .glitch::after {
      content: attr(data-text);
      position: absolute;
      left: 0;
      width: 100%;
      overflow: hidden;
      color: white;
      clip: rect(0, 900px, 0, 0);
    }

    .glitch::before {
      animation: glitchTop 2s infinite linear;
      color: #aaa;
    }

    .glitch::after {
      animation: glitchBottom 2s infinite linear;
      color: #666;
    }

    @keyframes glitchTop {
      0% { clip: rect(0, 9999px, 0, 0); }
      10% { clip: rect(0, 9999px, 50px, 0); }
      20% { clip: rect(0, 9999px, 0, 0); }
      100% { clip: rect(0, 9999px, 0, 0); }
    }

    @keyframes glitchBottom {
      0% { clip: rect(0, 9999px, 0, 0); }
      10% { clip: rect(50px, 9999px, 100px, 0); }
      20% { clip: rect(0, 9999px, 0, 0); }
      100% { clip: rect(0, 9999px, 0, 0); }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="glitch" data-text="enter the code">enter the code</h1>

  <input type="password" id="code" placeholder="...">
  <br>
  <button onclick="checkCode()">enter</button>

  <div id="result"></div>
</div>

<script>
function checkCode() {
  const input = document.getElementById("code").value.toLowerCase();
  const result = document.getElementById("result");

  if (input === "721") {
    result.innerHTML = "not everything is random.";
  } 
  else if (input === "faaris") {
    result.innerHTML = "so... you found me.";
  } 
  else if (input === "i know") {
    result.innerHTML = "then why did it take you so long?";
  } 
  else {
    result.innerHTML = "wrong.";
  }
}
</script>

</body>
</html>
